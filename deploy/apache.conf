<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/web
    RemoteIPHeader X-Forwarded-For

    <Directory /var/www/app/web>
        AllowOverride None
        Require all granted
        Options -Indexes
        RewriteEngine On
        # La API y los health checks van a PHP; todo lo demás es la interfaz React.
        RewriteRule ^(api/|health|metrics) server.php [QSA,L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        Header always set X-Frame-Options DENY
        Header always set X-Content-Type-Options nosniff
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
