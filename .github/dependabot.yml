# Dependabot: una sola propuesta mensual por ecosistema, con todas las actualizaciones agrupadas.
# Las alertas de seguridad se siguen abriendo apenas se publican.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      composer: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      docker: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
