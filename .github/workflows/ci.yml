# Pipeline de integración continua (tareas T18 y T19 del plan).
# Cada push o pull request ejecuta: estilo, análisis estático, pruebas (unitarias,
# integración y concurrencia contra MySQL real), SAST, auditoría de dependencias,
# detección de secretos y construcción de las imágenes Docker.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · PHP 8.3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tutorias_test
          MYSQL_USER: tutorias
          MYSQL_PASSWORD: tutorias_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_DATABASE: tutorias_test
      TEST_DB_USERNAME: tutorias
      TEST_DB_PASSWORD: tutorias_ci
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl
          coverage: pcov
          tools: composer:v2
      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Estilo (PSR-12)
        run: vendor/bin/phpcs
      - name: Análisis estático (PHPStan nivel 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pruebas unitarias
        run: vendor/bin/phpunit --testsuite unit
      - name: Pruebas de integración y concurrencia (MySQL 8.4)
        run: vendor/bin/phpunit --testsuite integration --coverage-clover coverage.xml --coverage-text
      - name: Auditoría de dependencias
        run: composer audit --no-dev
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  frontend:
    name: Frontend · React + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: DevSecOps · SAST y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detección de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST (Semgrep · reglas PHP, JS y OWASP Top 10)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/php --config p/javascript --config p/owasp-top-ten --severity ERROR --error --exclude legacy --exclude backend/database/legacy

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Construir API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: tutorias-api:${{ github.sha }}
      - name: Construir web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: tutorias-web:${{ github.sha }}
      - name: Validar docker compose
        run: cp .env.example .env && docker compose config -q
